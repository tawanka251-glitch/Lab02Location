<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR ตามพิกัด · 0214381 Lab 3</title>

  <!-- ห้ามแก้ 2 บรรทัดนี้: A-Frame 1.6.0 และ AR.js 3.4.8 (ชุดเดียวกับ Lab 1) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    // ให้วัตถุหันหน้าเข้าหาผู้ใช้เสมอ (อ่านป้ายได้จากทุกทิศ)
    AFRAME.registerComponent('face-me', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const me = new THREE.Vector3(), target = new THREE.Vector3();
        this.el.object3D.getWorldPosition(me); cam.getWorldPosition(target);
        target.y = me.y; // หมุนเฉพาะแนวนอน ป้ายไม่เอียงขึ้นลง
        this.el.object3D.lookAt(target);
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    /* ซ่อนหน้าจอฟ้า 3 จุด (A-Frame Loading Screen) อย่างเด็ดขาด */
    .a-loader-title, .a-loading-screen, .a-fullscreen .a-loader-title {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* บังคับให้ video จากกล้องแสดงผลเต็มจอ อยู่ใต้ canvas */
    video#arjs-video, body > video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: -2 !important;
      display: block !important;
    }

    /* บังคับให้ Canvas ของ A-Frame โปร่งใส เพื่อให้มองทะลุเห็นภาพกล้องจริง */
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      z-index: 1 !important;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(42, 27, 92, 0.88);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font: 14px/1.5 system-ui, sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    #hud b { color: #C9B8F0; }

    .hud-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 12px;
      background: #5b21b6;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .hud-btn:active {
      background: #7c3aed;
    }

    /* แถบแจ้งเตือนเมื่อต้องการแตะหน้าจอ */
    #tap-overlay {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-text">กำลังเชื่อมต่อกล้องและ GPS…</div>
    <button class="hud-btn" id="btn-recenter" style="display:none;">📍 ปักหมุด 3 รูปให้อยู่รอบตัวฉัน (ระยะไม่เกิน 5 ม.)</button>
  </div>

  <div id="tap-overlay">
    👆 แตะหน้าจอ 1 ครั้ง เพื่อเริ่มแสดงภาพจากกล้อง
  </div>

  <!-- A-Frame Scene -->
  <a-scene loading-screen="enabled: false"
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">

    <a-assets timeout="5000">
      <img id="screenshot-a" src="assets/point-a.png">
      <img id="screenshot-b" src="assets/point-b.png">
      <img id="screenshot-c" src="assets/point-c.png">
    </a-assets>

    <!-- กล้องที่รู้ตำแหน่ง GPS ของผู้ใช้ · ขยับทุก 1 เมตรให้อัปเดตตำแหน่ง -->
    <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>

    <!-- ① จุด A: ภาพหน้าจอ Minecraft · ห่างประมาณ 3 เมตร -->
    <a-entity data-name="จุด A" gps-new-entity-place="latitude: 7.808689; longitude: 99.941463">
      <a-image face-me src="#screenshot-a" width="2" height="1.13" position="0 1.5 0"></a-image>
    </a-entity>

    <!-- ② จุด B: ภาพหน้าจอ Stardew Valley · ห่างประมาณ 4-5 เมตร -->
    <a-entity data-name="จุด B" gps-new-entity-place="latitude: 7.808725; longitude: 99.941463">
      <a-image face-me src="#screenshot-b" width="2" height="1.07" position="0 1.5 0"></a-image>
    </a-entity>

    <!-- ③ จุด C: ภาพหน้าจอ Don't Starve · ห่างประมาณ 4 เมตร -->
    <a-entity data-name="จุด C" gps-new-entity-place="latitude: 7.808689; longitude: 99.941499">
      <a-image face-me src="#screenshot-c" width="1.5" height="1.5" position="0 1.5 0"></a-image>
    </a-entity>

  </a-scene>

  <script>
    const SIM = new URLSearchParams(location.search).has('sim');
    const hudText = document.getElementById('hud-text');
    const btnRecenter = document.getElementById('btn-recenter');
    const tapOverlay = document.getElementById('tap-overlay');
    const scene = document.querySelector('a-scene');
    const cam = document.querySelector('[gps-new-camera]');
    const places = [...document.querySelectorAll('[gps-new-entity-place]')];
    let me = null, accuracy = null;
    let gpsStatus = 'กำลังขอตำแหน่ง GPS…';
    let autoAnchored = false;

    // --------------------------------------------------------
    // ระบบเปิดกล้องสำหรับมือถือ (แก้ปัญหา Samsung & Android Autoplay)
    // --------------------------------------------------------
    function ensureCameraStream() {
      const v = document.querySelector('video') || document.getElementById('arjs-video');
      if (v) {
        v.muted = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        if (v.paused) {
          v.play().then(() => {
            tapOverlay.style.display = 'none';
          }).catch(() => {
            tapOverlay.style.display = 'block';
          });
        } else if (v.videoWidth > 0) {
          tapOverlay.style.display = 'none';
        }
      }

      // ตรวจสอบ fallback สำหรับมือถือหลายเลนส์ (Samsung multi-camera)
      if (!v || !v.srcObject || v.videoWidth === 0) {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          }).then(stream => {
            let vid = document.querySelector('video') || document.getElementById('arjs-video');
            if (vid) {
              vid.srcObject = stream;
              vid.muted = true;
              vid.play();
              tapOverlay.style.display = 'none';
            }
          }).catch(err => {
            console.warn('Fallback camera note:', err);
          });
        }
      }
    }

    // สั่งเปิดกล้องทันที และเมื่อผู้ใช้สัมผัสหน้าจอ
    ensureCameraStream();
    window.addEventListener('click', ensureCameraStream);
    window.addEventListener('touchstart', ensureCameraStream);

    // --------------------------------------------------------
    // คำนวณระยะทาง Haversine Formula (เมตร)
    // --------------------------------------------------------
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // วางทั้ง 3 รูปให้อยู่รอบตำแหน่งผู้ใช้ในระยะไม่เกิน 5 เมตร
    function placeTargetsNear(lat, lon) {
      const latA = lat + 0.000027; // จุด A: เหนือ ~3 ม.
      const lonA = lon;

      const latB = lat + 0.000028; // จุด B: ตะวันออกเฉียงเหนือ ~4.5 ม.
      const lonB = lon + 0.000028;

      const latC = lat;            // จุด C: ตะวันออก ~4 ม.
      const lonC = lon + 0.000036;

      places[0].setAttribute('gps-new-entity-place', { latitude: latA, longitude: lonA });
      places[1].setAttribute('gps-new-entity-place', { latitude: latB, longitude: lonB });
      places[2].setAttribute('gps-new-entity-place', { latitude: latC, longitude: lonC });
    }

    btnRecenter.addEventListener('click', () => {
      if (me) {
        placeTargetsNear(me.latitude, me.longitude);
        alert('ปักหมุดทั้ง 3 รูปไว้รอบตัวคุณในระยะไม่เกิน 5 เมตรแล้วครับ');
      }
    });

    scene.addEventListener('loaded', () => {
      if (SIM) {
        const a = places[0].getAttribute('gps-new-entity-place');
        setTimeout(() => cam.setAttribute('gps-new-camera', {
          simulateLatitude: a.latitude - 0.000035, simulateLongitude: a.longitude
        }), 500);
      }
    });

    cam.addEventListener('gps-camera-update-position', e => {
      me = e.detail.position;
      gpsStatus = SIM ? 'โหมดจำลอง' : 'รับตำแหน่ง GPS แล้ว';
    });

    // อ่านความแม่นยำของ GPS
    if (!SIM) {
      if (!window.isSecureContext) {
        gpsStatus = 'GPS ใช้ไม่ได้: ต้องเปิดผ่าน HTTPS (GitHub Pages)';
      } else if (!navigator.geolocation) {
        gpsStatus = 'เบราว์เซอร์นี้ไม่รองรับ GPS กรุณาเปิดด้วย Chrome หรือ Safari';
      } else {
        navigator.geolocation.watchPosition(p => {
          me = { latitude: p.coords.latitude, longitude: p.coords.longitude };
          accuracy = p.coords.accuracy;
          gpsStatus = 'รับตำแหน่ง GPS แล้ว';
          btnRecenter.style.display = 'inline-block';

          if (!autoAnchored) {
            placeTargetsNear(me.latitude, me.longitude);
            autoAnchored = true;
          }
        }, error => {
          const messages = {
            1: 'ไม่ได้รับอนุญาตใช้ตำแหน่ง: อนุญาต Location ในการตั้งค่า Chrome',
            2: 'หาตำแหน่งไม่พบ: เปิด Location ของมือถือ แล้วออกไปที่โล่ง',
            3: 'ขอตำแหน่งนานเกินไป: ลองใหม่อีกครั้ง'
          };
          gpsStatus = messages[error.code] || 'อ่านตำแหน่งไม่ได้';
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      }
    }

    setInterval(() => {
      if (!me) {
        hudText.textContent = gpsStatus;
        return;
      }
      const acc = SIM ? 'โหมดจำลอง' : (accuracy ? '± ' + Math.round(accuracy) + ' ม.' : '…');
      const rows = places.map(p => {
        let d = p.components['gps-new-entity-place'] ? p.components['gps-new-entity-place'].distance : undefined;
        if ((d === undefined || isNaN(d)) && me) {
          const pos = p.getAttribute('gps-new-entity-place');
          if (pos) {
            d = calculateDistance(me.latitude, me.longitude, parseFloat(pos.latitude), parseFloat(pos.longitude));
          }
        }
        return `${p.dataset.name}: <b>${d === undefined ? '…' : Math.round(d) + ' ม.'}</b>`;
      }).join(' · ');

      hudText.innerHTML = `${gpsStatus}<br>ฉันอยู่ที่ ${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)} · ความแม่นยำ <b>${acc}</b><br>${rows}`;
    }, 1000);
  </script>
</body>
</html>
