<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR ตามพิกัด · 0214381 Lab 3</title>

  <!-- ห้ามแก้ 2 บรรทัดนี้: A-Frame 1.6.0 และ AR.js 3.4.8 (ชุดเดียวกับ Lab 1) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    // ให้ภาพหันหน้าเข้าหาผู้ใช้เสมอ
    AFRAME.registerComponent('face-me', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const me = new THREE.Vector3(), target = new THREE.Vector3();
        this.el.object3D.getWorldPosition(me); cam.getWorldPosition(target);
        target.y = me.y;
        this.el.object3D.lookAt(target);
      }
    });
  </script>

  <style>
    /* ปิดหน้าจอฟ้า 3 จุด ของ A-Frame */
    .a-loader-title, .a-loading-screen, .a-fullscreen .a-loader-title {
      display: none !important;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(42, 27, 92, 0.9);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #hud b { color: #C9B8F0; }

    .btn-action {
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .btn-action:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: #6366f1;
      margin-left: 6px;
    }

    #camera-banner {
      position: fixed;
      bottom: 24px;
      left: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <!-- แถบข้อมูลด้านบน -->
  <div id="hud">
    <div id="hud-text">กำลังเชื่อมต่อกล้องและ GPS…</div>
    <div>
      <button class="btn-action btn-secondary" id="btn-recenter" style="display:none;">📍 ปักหมุดรอบตัวฉัน (5 ม.)</button>
    </div>
  </div>

  <!-- แถบปุ่มเปิดกล้องขนาดใหญ่ด้านล่าง (กรณีเบราว์เซอร์ไม่เปิดอัตโนมัติ) -->
  <div id="camera-banner">
    <div style="color: #fff; font-size: 14px; font-weight: bold; margin-bottom: 8px;">
      📷 หากภาพกล้องยังไม่ขึ้น ให้กดปุ่มด้านล่างนี้ครับ
    </div>
    <button class="btn-action" id="btn-force-camera" style="font-size: 15px; padding: 10px 20px; background: #0284c7; width: 100%;">
      ▶️ แตะเพื่อเปิดกล้อง (Start Camera)
    </button>
    <div id="camera-error-msg" style="color: #f87171; font-size: 12px; margin-top: 6px; display: none;"></div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene loading-screen="enabled: false"
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">

    <a-assets timeout="10000">
      <img id="screenshot-a" src="assets/point-a.png">
      <img id="screenshot-b" src="assets/point-b.png">
      <img id="screenshot-c" src="assets/point-c.png">
    </a-assets>

    <!-- กล้องรับตำแหน่ง GPS -->
    <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>

    <!-- จุดเริ่มต้นในฉาก -->
    <a-entity id="point-a" class="target-entity" data-name="จุด A" gps-new-entity-place="latitude: 7.808689; longitude: 99.941463">
      <a-image face-me src="#screenshot-a" width="2.2" height="1.24" position="0 1.5 0"></a-image>
    </a-entity>

    <a-entity id="point-b" class="target-entity" data-name="จุด B" gps-new-entity-place="latitude: 7.808725; longitude: 99.941463">
      <a-image face-me src="#screenshot-b" width="2.2" height="1.17" position="0 1.5 0"></a-image>
    </a-entity>

    <a-entity id="point-c" class="target-entity" data-name="จุด C" gps-new-entity-place="latitude: 7.808689; longitude: 99.941499">
      <a-image face-me src="#screenshot-c" width="1.8" height="1.8" position="0 1.5 0"></a-image>
    </a-entity>

  </a-scene>

  <script>
    const SIM = new URLSearchParams(location.search).has('sim');
    const hudText = document.getElementById('hud-text');
    const btnRecenter = document.getElementById('btn-recenter');
    const btnForceCamera = document.getElementById('btn-force-camera');
    const cameraBanner = document.getElementById('camera-banner');
    const cameraErrorMsg = document.getElementById('camera-error-msg');
    const scene = document.querySelector('a-scene');
    const cam = document.querySelector('[gps-new-camera]');
    let me = null, accuracy = null;
    let gpsStatus = 'กำลังค้นหาตำแหน่ง GPS… (กรุณากดยินยอม)';
    let cameraWorking = false;
    let autoAnchored = false;

    // ----------------------------------------------------
    // ฟังก์ชันสั่งเปิดกล้อง (ทริกเกอร์โดยตรงจากการกดปุ่ม)
    // ----------------------------------------------------
    async function requestCameraAccess() {
      cameraErrorMsg.style.display = 'none';
      btnForceCamera.textContent = '⏳ กำลังเปิดกล้อง...';

      try {
        let stream;
        try {
          // พยายามเปิดกล้องหลังแบบ ideal
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: 'environment' } }
          });
        } catch (e1) {
          // ถ้าติดปัญหาเรื่อง multi-camera ให้เปิดแบบพื้นฐาน
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: true
          });
        }

        // นำสัญญาณภาพไปใส่ใน <video> ของ AR.js
        let video = document.querySelector('video') || document.getElementById('arjs-video');
        if (!video) {
          video = document.createElement('video');
          video.id = 'arjs-video';
          video.setAttribute('autoplay', '');
          video.setAttribute('muted', '');
          video.setAttribute('playsinline', '');
          video.setAttribute('webkit-playsinline', '');
          document.body.appendChild(video);
        }
        video.srcObject = stream;
        video.muted = true;
        await video.play();

        cameraWorking = true;
        cameraBanner.style.display = 'none';

      } catch (err) {
        console.error('Camera Error:', err);
        btnForceCamera.textContent = '🔄 กดลองใหม่อีกครั้ง';
        cameraErrorMsg.style.display = 'block';

        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          cameraErrorMsg.innerHTML = '⚠️ <b>สิทธิ์กล้องถูกปฏิเสธ:</b><br>1. แตะไอคอน 🔒 ซ้ายมือของชื่อเว็บ<br>2. เปลี่ยน "กล้อง" เป็น "อนุญาต"<br>3. หากยังไม่ได้ ให้ไปที่ การตั้งค่ามือถือ > แอป > Chrome > สิทธิ์ > กล้อง > เลือก "อนุญาต"';
        } else if (err.name === 'NotReadableError') {
          cameraErrorMsg.innerHTML = '⚠️ <b>กล้องกำลังถูกแอปอื่นใช้งาน:</b> กรุณาปิดแอปกล้องหรือแอปอื่น แล้วลองใหม่ครับ';
        } else {
          cameraErrorMsg.innerHTML = '⚠️ ข้อผิดพลาด: ' + err.name + ' (' + err.message + ')';
        }
      }
    }

    btnForceCamera.addEventListener('click', requestCameraAccess);
    window.addEventListener('touchstart', () => {
      const v = document.querySelector('video');
      if (v && v.paused) v.play().catch(() => {});
    }, { once: true });

    // ตรวจสอบสถานะกล้องสม่ำเสมอ ถ้าภาพมาแล้วให้ซ่อนป้ายเปิดกล้อง
    setInterval(() => {
      const v = document.querySelector('video') || document.getElementById('arjs-video');
      if (v && v.videoWidth > 0 && !v.paused) {
        cameraWorking = true;
        cameraBanner.style.display = 'none';
      }
    }, 1000);

    // ----------------------------------------------------
    // คำนวณระยะทาง Haversine Formula (เมตร)
    // ----------------------------------------------------
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ----------------------------------------------------
    // วางตำแหน่งภาพทั้ง 3 รูปใหม่อยู่ในระยะ 3 - 4.5 เมตร
    // ----------------------------------------------------
    function spawnTargetsAt(userLat, userLon) {
      document.querySelectorAll('.target-entity').forEach(el => el.remove());

      const configs = [
        { name: 'จุด A', img: '#screenshot-a', lat: userLat + 0.000027, lon: userLon, w: 2.2, h: 1.24 },
        { name: 'จุด B', img: '#screenshot-b', lat: userLat + 0.000028, lon: userLon + 0.000028, w: 2.2, h: 1.17 },
        { name: 'จุด C', img: '#screenshot-c', lat: userLat, lon: userLon + 0.000036, w: 1.8, h: 1.8 }
      ];

      configs.forEach(cfg => {
        const entity = document.createElement('a-entity');
        entity.className = 'target-entity';
        entity.dataset.name = cfg.name;
        entity.setAttribute('gps-new-entity-place', `latitude: ${cfg.lat}; longitude: ${cfg.lon}`);

        const image = document.createElement('a-image');
        image.setAttribute('face-me', '');
        image.setAttribute('src', cfg.img);
        image.setAttribute('width', cfg.w);
        image.setAttribute('height', cfg.h);
        image.setAttribute('position', '0 1.5 0'); // วางที่ระดับสายตา

        entity.appendChild(image);
        scene.appendChild(entity);
      });
    }

    btnRecenter.addEventListener('click', () => {
      if (me) {
        spawnTargetsAt(me.latitude, me.longitude);
        alert('ปักหมุดทั้ง 3 รูปไว้รอบตัวคุณในระยะไม่เกิน 5 เมตรแล้วครับ');
      }
    });

    // ----------------------------------------------------
    // โหมดจำลอง (?sim)
    // ----------------------------------------------------
    scene.addEventListener('loaded', () => {
      if (SIM) {
        const baseLat = 7.808689;
        const baseLon = 99.941463;
        spawnTargetsAt(baseLat, baseLon);

        setTimeout(() => {
          cam.setAttribute('gps-new-camera', {
            simulateLatitude: baseLat - 0.000035, // ยืนห่างประมาณ 3.8 เมตร
            simulateLongitude: baseLon
          });
        }, 500);
      }
    });

    cam.addEventListener('gps-camera-update-position', e => {
      me = e.detail.position;
      gpsStatus = SIM ? 'โหมดจำลอง' : 'รับตำแหน่ง GPS แล้ว';
    });

    // ----------------------------------------------------
    // อ่านพิกัด GPS จริงจากมือถือ
    // ----------------------------------------------------
    if (!SIM) {
      if (!window.isSecureContext) {
        gpsStatus = 'GPS ใช้ไม่ได้: ต้องเปิดผ่าน HTTPS (GitHub Pages)';
      } else if (!navigator.geolocation) {
        gpsStatus = 'เบราว์เซอร์นี้ไม่รองรับ GPS กรุณาเปิดด้วย Chrome หรือ Safari';
      } else {
        navigator.geolocation.watchPosition(p => {
          me = { latitude: p.coords.latitude, longitude: p.coords.longitude };
          accuracy = p.coords.accuracy;
          gpsStatus = 'รับตำแหน่ง GPS แล้ว';
          btnRecenter.style.display = 'inline-block';

          if (!autoAnchored) {
            spawnTargetsAt(me.latitude, me.longitude);
            autoAnchored = true;
          }
        }, error => {
          const messages = {
            1: 'ไม่ได้รับอนุญาตใช้ตำแหน่ง: อนุญาต Location ในการตั้งค่าเบราว์เซอร์',
            2: 'หาตำแหน่งไม่พบ: เปิด Location ของมือถือ แล้วออกไปที่โล่ง',
            3: 'ขอตำแหน่งนานเกินไป: ลองใหม่อีกครั้ง'
          };
          gpsStatus = messages[error.code] || 'อ่านตำแหน่งไม่ได้';
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      }
    }

    // ----------------------------------------------------
    // อัปเดตข้อมูลบนแถบ HUD ทุก 1 วินาที
    // ----------------------------------------------------
    setInterval(() => {
      if (!me) {
        hudText.textContent = gpsStatus;
        return;
      }
      const acc = SIM ? 'โหมดจำลอง' : (accuracy ? '± ' + Math.round(accuracy) + ' ม.' : '…');
      const targetElements = document.querySelectorAll('.target-entity');
      const rows = Array.from(targetElements).map(p => {
        let d = p.components['gps-new-entity-place'] ? p.components['gps-new-entity-place'].distance : undefined;
        if ((d === undefined || isNaN(d)) && me) {
          const pos = p.getAttribute('gps-new-entity-place');
          if (pos) {
            d = calculateDistance(me.latitude, me.longitude, parseFloat(pos.latitude), parseFloat(pos.longitude));
          }
        }
        return `${p.dataset.name}: <b>${d === undefined ? '…' : Math.round(d) + ' ม.'}</b>`;
      }).join(' · ');

      hudText.innerHTML = `${gpsStatus}<br>ฉันอยู่ที่ ${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)} · ความแม่นยำ <b>${acc}</b><br>${rows || 'กำลังปักหมุดภาพรอบตัวคุณ...'}`;
    }, 1000);
  </script>
</body>
</html>
