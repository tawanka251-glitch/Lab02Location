<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR ตามพิกัด · 0214381 Lab 3</title>

  <!-- ห้ามแก้ 2 บรรทัดนี้: A-Frame 1.6.0 และ AR.js 3.4.8 (ชุดเดียวกับ Lab 1) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    // ให้วัตถุหันหน้าเข้าหาผู้ใช้เสมอ (อ่านป้ายได้จากทุกทิศ)
    AFRAME.registerComponent('face-me', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const me = new THREE.Vector3(), target = new THREE.Vector3();
        this.el.object3D.getWorldPosition(me); cam.getWorldPosition(target);
        target.y = me.y; // หมุนเฉพาะแนวนอน ป้ายไม่เอียงขึ้นลง
        this.el.object3D.lookAt(target);
      }
    });
  </script>

  <style>
    /* ปิดหน้าจอฟ้า 3 จุดของ A-Frame */
    .a-loader-title, .a-loading-screen, .a-fullscreen .a-loader-title {
      display: none !important;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(42, 27, 92, 0.88);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font: 14px/1.5 system-ui, sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    #hud b { color: #C9B8F0; }

    .hud-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 12px;
      background: #5b21b6;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .hud-btn:active {
      background: #7c3aed;
    }

    /* ป้ายแจ้งเตือนให้แตะหน้าจอ 1 ครั้งเพื่อเริ่มกล้อง */
    #tap-msg {
      position: fixed;
      bottom: 24px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffcb05;
      border: 1px solid rgba(255, 203, 5, 0.5);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-text">กำลังเชื่อมต่อกล้องและตำแหน่ง GPS…</div>
    <button class="hud-btn" id="btn-recenter" style="display:none;">📍 ปักหมุด 3 รูปให้อยู่รอบตัวฉัน (ระยะไม่เกิน 5 ม.)</button>
  </div>

  <div id="tap-msg">
    👆 แตะหน้าจอ 1 ครั้งเพื่อเปิดภาพจากกล้อง
  </div>

  <!-- A-Frame Scene (ใช้ videoTexture: true ซึ่งเป็นค่ามาตรฐานของ AR.js สำหรับดึงภาพกล้องจริงมาแสดงในฉาก 3D) -->
  <a-scene loading-screen="enabled: false"
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">

    <a-assets timeout="10000">
      <img id="screenshot-a" src="assets/point-a.png">
      <img id="screenshot-b" src="assets/point-b.png">
      <img id="screenshot-c" src="assets/point-c.png">
    </a-assets>

    <!-- กล้องที่รับตำแหน่ง GPS ของผู้ใช้ -->
    <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>

  </a-scene>

  <script>
    const SIM = new URLSearchParams(location.search).has('sim');
    const hudText = document.getElementById('hud-text');
    const btnRecenter = document.getElementById('btn-recenter');
    const tapMsg = document.getElementById('tap-msg');
    const scene = document.querySelector('a-scene');
    const cam = document.querySelector('[gps-new-camera]');
    let me = null, accuracy = null;
    let gpsStatus = 'กำลังขอตำแหน่ง GPS… (กรุณากดอนุญาต)';
    let autoAnchored = false;

    // --------------------------------------------------------
    // ปลดล็อกการเล่นวิดีโอจากกล้องบนมือถือ (Autoplay Policy)
    // --------------------------------------------------------
    function unlockCameraVideo() {
      const v = document.querySelector('video') || document.getElementById('arjs-video');
      if (v) {
        v.muted = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        v.play().then(() => {
          if (tapMsg) tapMsg.style.display = 'none';
        }).catch(() => {});
      }
    }
    window.addEventListener('click', unlockCameraVideo);
    window.addEventListener('touchstart', unlockCameraVideo);

    // ตรวจสอบภาพวิดีโอ ถ้าภาพมาแล้วให้ซ่อนป้ายแจ้งเตือน
    setInterval(() => {
      const v = document.querySelector('video') || document.getElementById('arjs-video');
      if (v && v.videoWidth > 0 && !v.paused) {
        if (tapMsg) tapMsg.style.display = 'none';
      }
    }, 800);

    // --------------------------------------------------------
    // คำนวณระยะทาง Haversine Formula (เมตร)
    // --------------------------------------------------------
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // --------------------------------------------------------
    // สร้างและวางภาพทั้ง 3 รูปในระยะไม่เกิน 5 เมตร (3 - 4.5 เมตร)
    // โดยสร้าง Entity สดใหม่เพื่อให้ AR.js คำนวณตำแหน่ง 3D ได้ทันที
    // --------------------------------------------------------
    function spawnTargetsAt(userLat, userLon) {
      // ลบรูปภาพเดิมออกก่อน (ถ้ามี)
      document.querySelectorAll('.target-entity').forEach(el => el.remove());

      // 1 เมตร ≈ 0.000009 องศา
      // จุด A: ห่างไปทางเหนือ ~3 เมตร
      // จุด B: ห่างไปทางตะวันออกเฉียงเหนือ ~4.5 เมตร
      // จุด C: ห่างไปทางตะวันออก ~4 เมตร
      const configs = [
        {
          name: 'จุด A',
          img: '#screenshot-a',
          lat: userLat + 0.000027,
          lon: userLon,
          w: 2.2, h: 1.24
        },
        {
          name: 'จุด B',
          img: '#screenshot-b',
          lat: userLat + 0.000028,
          lon: userLon + 0.000028,
          w: 2.2, h: 1.17
        },
        {
          name: 'จุด C',
          img: '#screenshot-c',
          lat: userLat,
          lon: userLon + 0.000036,
          w: 1.8, h: 1.8
        }
      ];

      configs.forEach(cfg => {
        const entity = document.createElement('a-entity');
        entity.className = 'target-entity';
        entity.dataset.name = cfg.name;
        entity.setAttribute('gps-new-entity-place', `latitude: ${cfg.lat}; longitude: ${cfg.lon}`);

        const image = document.createElement('a-image');
        image.setAttribute('face-me', '');
        image.setAttribute('src', cfg.img);
        image.setAttribute('width', cfg.w);
        image.setAttribute('height', cfg.h);
        image.setAttribute('position', '0 1.5 0'); // วางที่ระดับสายตา (สูง 1.5 เมตร)

        entity.appendChild(image);
        scene.appendChild(entity);
      });
    }

    btnRecenter.addEventListener('click', () => {
      if (me) {
        spawnTargetsAt(me.latitude, me.longitude);
        alert('ปักหมุดทั้ง 3 รูปไว้รอบตัวคุณในระยะไม่เกิน 5 เมตรแล้วครับ');
      }
    });

    // --------------------------------------------------------
    // โหมดจำลอง (?sim) สำหรับทดสอบ
    // --------------------------------------------------------
    scene.addEventListener('loaded', () => {
      if (SIM) {
        const baseLat = 7.808689;
        const baseLon = 99.941463;
        spawnTargetsAt(baseLat, baseLon);

        setTimeout(() => {
          cam.setAttribute('gps-new-camera', {
            simulateLatitude: baseLat - 0.000035, // ยืนห่างไปทางใต้ประมาณ 3.8 เมตร (ไม่เกิน 5 เมตร)
            simulateLongitude: baseLon
          });
        }, 500);
      }
    });

    cam.addEventListener('gps-camera-update-position', e => {
      me = e.detail.position;
      gpsStatus = SIM ? 'โหมดจำลอง' : 'รับตำแหน่ง GPS แล้ว';
    });

    // --------------------------------------------------------
    // รับตำแหน่ง GPS จริงจากโทรศัพท์มือถือ
    // --------------------------------------------------------
    if (!SIM) {
      if (!window.isSecureContext) {
        gpsStatus = 'GPS ใช้ไม่ได้: ต้องเปิดผ่าน HTTPS (GitHub Pages)';
      } else if (!navigator.geolocation) {
        gpsStatus = 'เบราว์เซอร์นี้ไม่รองรับ GPS กรุณาเปิดด้วย Chrome หรือ Safari';
      } else {
        navigator.geolocation.watchPosition(p => {
          me = { latitude: p.coords.latitude, longitude: p.coords.longitude };
          accuracy = p.coords.accuracy;
          gpsStatus = 'รับตำแหน่ง GPS แล้ว';
          btnRecenter.style.display = 'inline-block';

          // เมื่อต่อ GPS ได้ครั้งแรก ปักหมุดทั้ง 3 รูปไว้รอบตัวทันทีในระยะไม่เกิน 5 เมตร
          if (!autoAnchored) {
            spawnTargetsAt(me.latitude, me.longitude);
            autoAnchored = true;
          }
        }, error => {
          const messages = {
            1: 'ไม่ได้รับอนุญาตใช้ตำแหน่ง: อนุญาต Location ในการตั้งค่าเบราว์เซอร์',
            2: 'หาตำแหน่งไม่พบ: เปิด Location ของมือถือ แล้วออกไปที่โล่ง',
            3: 'ขอตำแหน่งนานเกินไป: ลองใหม่อีกครั้ง'
          };
          gpsStatus = messages[error.code] || 'อ่านตำแหน่งไม่ได้';
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      }
    }

    // อัปเดตข้อมูลบนแถบ HUD ทุก 1 วินาที
    setInterval(() => {
      if (!me) {
        hudText.textContent = gpsStatus;
        return;
      }
      const acc = SIM ? 'โหมดจำลอง' : (accuracy ? '± ' + Math.round(accuracy) + ' ม.' : '…');
      const targetElements = document.querySelectorAll('.target-entity');
      const rows = Array.from(targetElements).map(p => {
        let d = p.components['gps-new-entity-place'] ? p.components['gps-new-entity-place'].distance : undefined;
        if ((d === undefined || isNaN(d)) && me) {
          const pos = p.getAttribute('gps-new-entity-place');
          if (pos) {
            d = calculateDistance(me.latitude, me.longitude, parseFloat(pos.latitude), parseFloat(pos.longitude));
          }
        }
        return `${p.dataset.name}: <b>${d === undefined ? '…' : Math.round(d) + ' ม.'}</b>`;
      }).join(' · ');

      hudText.innerHTML = `${gpsStatus}<br>ฉันอยู่ที่ ${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)} · ความแม่นยำ <b>${acc}</b><br>${rows || 'กำลังปักหมุดภาพรอบตัวคุณ...'}`;
    }, 1000);
  </script>
</body>
</html>
