<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR ตามพิกัด · 0214381 Lab 3</title>
  <!-- ห้ามแก้ 2 บรรทัดนี้: A-Frame 1.6.0 และ AR.js 3.4.8 (ชุดเดียวกับ Lab 1) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
    // ให้วัตถุหันหน้าเข้าหาผู้ใช้เสมอ (อ่านป้ายได้จากทุกทิศ)
    AFRAME.registerComponent('face-me', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const me = new THREE.Vector3(), target = new THREE.Vector3();
        this.el.object3D.getWorldPosition(me); cam.getWorldPosition(target);
        target.y = me.y;                       // หมุนเฉพาะแนวนอน ป้ายไม่เอียงขึ้นลง
        this.el.object3D.lookAt(target);
      }
    });
  </script>
  <style>
    #hud { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10;
           background: rgba(42,27,92,.85); color: #fff; border-radius: 12px;
           padding: 10px 14px; font: 14px/1.5 system-ui, sans-serif;
           box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    #hud b { color: #C9B8F0; }
    .hud-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      background: #5b21b6;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .hud-btn:active {
      background: #7c3aed;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div id="hud">
    <div id="hud-text">กำลังขอตำแหน่ง GPS… (อนุญาตกล้องและตำแหน่ง)</div>
    <button class="hud-btn" id="btn-recenter" style="display:none;">📍 ปักหมุด 3 รูปให้อยู่รอบตัวฉัน (ระยะไม่เกิน 5 ม.)</button>
  </div>

  <a-scene loading-screen="enabled: false"
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">

    <a-assets timeout="10000">
      <img id="screenshot-a" src="assets/point-a.png">
      <img id="screenshot-b" src="assets/point-b.png">
      <img id="screenshot-c" src="assets/point-c.png">
    </a-assets>

    <!-- กล้องที่รู้ตำแหน่ง GPS ของผู้ใช้ · ขยับทุก 1 เมตรให้อัปเดตตำแหน่งอย่างต่อเนื่อง -->
    <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>

    <!-- หน่วยของขนาดในโหมดนี้คือ "เมตรจริง"
         กำหนดพิกัดเริ่มต้นให้อยู่ห่างกันไม่เกิน 5 เมตร -->

    <!-- ① จุด A: ภาพหน้าจอ Minecraft · ห่างประมาณ 3 เมตร -->
    <a-entity data-name="จุด A" gps-new-entity-place="latitude: 7.808689; longitude: 99.941463">
      <a-image face-me src="#screenshot-a" width="2" height="1.13" position="0 1.5 0"></a-image>
    </a-entity>

    <!-- ② จุด B: ภาพหน้าจอ Stardew Valley · ห่างประมาณ 4-5 เมตร -->
    <a-entity data-name="จุด B" gps-new-entity-place="latitude: 7.808725; longitude: 99.941463">
      <a-image face-me src="#screenshot-b" width="2" height="1.07" position="0 1.5 0"></a-image>
    </a-entity>

    <!-- ③ จุด C: ภาพหน้าจอ Don't Starve · ห่างประมาณ 4 เมตร -->
    <a-entity data-name="จุด C" gps-new-entity-place="latitude: 7.808689; longitude: 99.941499">
      <a-image face-me src="#screenshot-c" width="1.5" height="1.5" position="0 1.5 0"></a-image>
    </a-entity>

  </a-scene>

  <script>
    // โหมดจำลอง: เปิดลิงก์แล้วต่อท้ายด้วย ?sim จะ "ยืน" ห่างจุด A ประมาณ 3.8 เมตร (ไม่เกิน 5 เมตร)
    const SIM = new URLSearchParams(location.search).has('sim');
    const hud = document.getElementById('hud');
    const hudText = document.getElementById('hud-text');
    const btnRecenter = document.getElementById('btn-recenter');
    const scene = document.querySelector('a-scene');
    const cam = document.querySelector('[gps-new-camera]');
    const places = [...document.querySelectorAll('[gps-new-entity-place]')];
    let me = null, accuracy = null;
    let gpsStatus = 'กำลังขอตำแหน่ง GPS… อนุญาตการเข้าถึงตำแหน่งเมื่อเบราว์เซอร์ถาม';
    let autoAnchored = false;

    // คำนวณระยะทางระหว่างพิกัดเป็นเมตร (Haversine Formula)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // วางทั้ง 3 รูปให้อยู่รอบตำแหน่งผู้ใช้ในระยะไม่เกิน 5 เมตร (ประมาณ 3 - 4.5 เมตร)
    function placeTargetsNear(lat, lon) {
      // 0.000009 องศา ละติจูด ≈ 1 เมตร
      // จุด A: ห่างไปทางเหนือ ~3 เมตร
      const latA = lat + 0.000027;
      const lonA = lon;

      // จุด B: ห่างไปทางตะวันออกเฉียงเหนือ ~4.5 เมตร
      const latB = lat + 0.000028;
      const lonB = lon + 0.000028;

      // จุด C: ห่างไปทางตะวันออก ~4 เมตร
      const latC = lat;
      const lonC = lon + 0.000036;

      places[0].setAttribute('gps-new-entity-place', { latitude: latA, longitude: lonA });
      places[1].setAttribute('gps-new-entity-place', { latitude: latB, longitude: lonB });
      places[2].setAttribute('gps-new-entity-place', { latitude: latC, longitude: lonC });
    }

    btnRecenter.addEventListener('click', () => {
      if (me) {
        placeTargetsNear(me.latitude, me.longitude);
        alert('ปักหมุดทั้ง 3 รูปไว้รอบตัวคุณในระยะไม่เกิน 5 เมตรแล้วครับ');
      }
    });

    scene.addEventListener('loaded', () => {
      if (SIM) {
        const a = places[0].getAttribute('gps-new-entity-place');
        // จำลองให้ยืนห่างจุด A ประมาณ 3.8 เมตร (ไม่เกิน 5 เมตร)
        setTimeout(() => cam.setAttribute('gps-new-camera', {
          simulateLatitude: a.latitude - 0.000035, simulateLongitude: a.longitude
        }), 500);
      }
    });

    let cameraStatus = '';

    // ตรวจสอบและดักจับข้อผิดพลาดของกล้อง
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'camera' }).then(res => {
        if (res.state === 'denied') {
          cameraStatus = '<br><span style="color:#ff8585;">⚠️ ไม่ได้รับอนุญาตใช้กล้อง: กรุณาอนุญาต Camera ใน Chrome</span>';
        }
        res.onchange = () => {
          cameraStatus = res.state === 'denied' ? '<br><span style="color:#ff8585;">⚠️ ไม่ได้รับอนุญาตใช้กล้อง: กรุณาอนุญาต Camera ใน Chrome</span>' : '';
        };
      }).catch(() => {});
    }

    window.addEventListener('camera-error', () => {
      cameraStatus = '<br><span style="color:#ff8585;">⚠️ กล้องเปิดไม่ได้: กรุณาอนุญาตสิทธิ์กล้อง (Camera) ใน Chrome แล้วรีเฟรช</span>';
    });

    cam.addEventListener('gps-camera-update-position', e => {
      me = e.detail.position;
      gpsStatus = SIM ? 'โหมดจำลอง' : 'รับตำแหน่ง GPS แล้ว';
    });

    // อ่านความแม่นยำของ GPS
    if (!SIM) {
      if (!window.isSecureContext) {
        gpsStatus = 'GPS ใช้ไม่ได้: เปิดหน้านี้ผ่าน HTTPS (เช่น GitHub Pages) ไม่ใช่ HTTP';
      } else if (!navigator.geolocation) {
        gpsStatus = 'เบราว์เซอร์นี้ไม่รองรับ GPS กรุณาเปิดด้วย Chrome หรือ Safari';
      } else {
        navigator.geolocation.watchPosition(p => {
          me = { latitude: p.coords.latitude, longitude: p.coords.longitude };
          accuracy = p.coords.accuracy;
          gpsStatus = 'รับตำแหน่ง GPS แล้ว';
          btnRecenter.style.display = 'inline-block';

          // เมื่อต่อ GPS ได้ครั้งแรก วางตำแหน่งทั้ง 3 รูปให้อยู่รอบตัวผู้ใช้ในระยะไม่เกิน 5 เมตรทันที
          if (!autoAnchored) {
            placeTargetsNear(me.latitude, me.longitude);
            autoAnchored = true;
          }
        }, error => {
          const messages = {
            1: 'ไม่ได้รับอนุญาตใช้ตำแหน่ง: อนุญาต Location ให้เว็บไซต์นี้ในการตั้งค่าเบราว์เซอร์',
            2: 'หาตำแหน่งไม่พบ: เปิด Location ของมือถือ แล้วออกไปที่โล่ง',
            3: 'ขอตำแหน่งนานเกินไป: ตรวจสอบ Location/สัญญาณ แล้วลองใหม่กลางแจ้ง'
          };
          gpsStatus = messages[error.code] || 'อ่านตำแหน่งไม่ได้: ตรวจสอบสิทธิ์ Location แล้วลองใหม่';
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      }
    }

    setInterval(() => {
      if (!me) {
        hudText.innerHTML = `${gpsStatus}${cameraStatus}`;
        return;
      }
      const acc = SIM ? 'โหมดจำลอง' : (accuracy ? '± ' + Math.round(accuracy) + ' ม.' : '…');
      const rows = places.map(p => {
        let d = p.components['gps-new-entity-place'] ? p.components['gps-new-entity-place'].distance : undefined;
        // คำนวณระยะทางสำรองหาก AR.js ยังไม่คำนวณ
        if ((d === undefined || isNaN(d)) && me) {
          const pos = p.getAttribute('gps-new-entity-place');
          if (pos) {
            d = calculateDistance(me.latitude, me.longitude, parseFloat(pos.latitude), parseFloat(pos.longitude));
          }
        }
        return `${p.dataset.name}: <b>${d === undefined ? '…' : Math.round(d) + ' ม.'}</b>`;
      }).join(' · ');

      hudText.innerHTML = `${gpsStatus}${cameraStatus}<br>ฉันอยู่ที่ ${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)} · ความแม่นยำ <b>${acc}</b><br>${rows}`;
    }, 1000);
  </script>
</body>
</html>
