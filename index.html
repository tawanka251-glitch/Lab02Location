<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR ตามพิกัด · 0214381 Lab 3</title>

  <!-- A-Frame 1.6.0 และ AR.js 3.4.8 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    // ให้ภาพหันหน้าเข้าหาผู้ใช้เสมอ (Billboard)
    AFRAME.registerComponent('face-me', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const me = new THREE.Vector3(), target = new THREE.Vector3();
        this.el.object3D.getWorldPosition(me);
        cam.getWorldPosition(target);
        target.y = me.y;
        this.el.object3D.lookAt(target);
      }
    });

    // สั่ง Three.js เคลียร์ฉากเป็นแบบโปร่งใส 100% ป้องกัน Canvas สีดำบังกล้อง
    AFRAME.registerComponent('transparent-canvas', {
      init: function () {
        const scene = this.el;
        const setClear = () => {
          if (scene.renderer) {
            scene.renderer.setClearColor(0x000000, 0);
          }
        };
        if (scene.renderer) {
          setClear();
        } else {
          scene.addEventListener('render-start', setClear);
        }
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ซ่อนหน้าจอโหลดสีฟ้าของ A-Frame */
    .a-loader-title, .a-loading-screen, .a-fullscreen .a-loader-title {
      display: none !important;
      visibility: hidden !important;
    }

    /* วิดีโอกล้อง Native Layer อยู่หลังสุด */
    video#arjs-video, body > video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: -1 !important;
      display: block !important;
    }

    /* Canvas 3D โปร่งใส อยู่เหนือวิดีโอ */
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      z-index: 1 !important;
    }

    /* แถบข้อมูลด้านบน (HUD) */
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(42, 27, 92, 0.92);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #hud b { color: #C9B8F0; }

    .btn-action {
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <!-- แถบข้อมูลด้านบน -->
  <div id="hud">
    <div id="hud-text">กำลังเชื่อมต่อกล้องและเซนเซอร์…</div>
    <div>
      <button class="btn-action" id="btn-recenter">📍 ปักหมุดรอบตัวฉัน (5 ม.)</button>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene transparent-canvas
           loading-screen="enabled: false"
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">

    <!-- กล้องรับตำแหน่ง GPS -->
    <a-camera gps-new-camera="gpsMinDistance: 1; positionMinAccuracy: 1000"></a-camera>

    <!-- วางภาพเริ่มต้นตรงหน้าระยะ 3-4 เมตรทันที (การันตีว่าเห็นภาพ 100% แม้ GPS ยังไม่พร้อม) -->
    <a-entity id="point-a" class="target-entity" data-name="Minecraft (A)" position="-1.6 1.5 -3.5">
      <a-image face-me src="assets/point-a.png" width="2.0" height="1.2" material="alphaTest: 0.1"></a-image>
    </a-entity>

    <a-entity id="point-b" class="target-entity" data-name="Stardew (B)" position="0 1.5 -3">
      <a-image face-me src="assets/point-b.png" width="2.0" height="1.1" material="alphaTest: 0.1"></a-image>
    </a-entity>

    <a-entity id="point-c" class="target-entity" data-name="Don't Starve (C)" position="1.6 1.5 -3.5">
      <a-image face-me src="assets/point-c.png" width="1.6" height="1.6" material="alphaTest: 0.1"></a-image>
    </a-entity>

  </a-scene>

  <script>
    const SIM = new URLSearchParams(location.search).has('sim');
    const hudText = document.getElementById('hud-text');
    const btnRecenter = document.getElementById('btn-recenter');
    const scene = document.querySelector('a-scene');
    const cam = document.querySelector('[gps-new-camera]');
    let me = null, accuracy = null;
    let gpsStatus = 'กำลังค้นหาตำแหน่ง GPS… (รูปภาพแสดงอยู่ตรงหน้าคุณแล้ว)';
    let isGpsAnchored = false;

    // ปลดล็อกการเล่นวิดีโอบนมือถือเมื่อแตะหน้าจอ 1 ครั้ง
    const unlockVideo = () => {
      const v = document.querySelector('video');
      if (v && v.paused) {
        v.play().catch(() => {});
      }
    };
    window.addEventListener('touchstart', unlockVideo, { once: true });
    window.addEventListener('click', unlockVideo, { once: true });

    // คำนวณระยะทาง Haversine Formula (เมตร)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // วางตำแหน่งภาพทั้ง 3 รูป ณ พิกัด GPS จริง ในระยะ 3 - 4.5 เมตร รอบตัวผู้ใช้
    function anchorTargetsToGps(userLat, userLon) {
      document.querySelectorAll('.target-entity').forEach(el => el.remove());

      const configs = [
        { name: 'Minecraft (A)', img: 'assets/point-a.png', lat: userLat + 0.000027, lon: userLon, w: 2.2, h: 1.24 },
        { name: 'Stardew (B)', img: 'assets/point-b.png', lat: userLat + 0.000028, lon: userLon + 0.000028, w: 2.2, h: 1.17 },
        { name: "Don't Starve (C)", img: 'assets/point-c.png', lat: userLat, lon: userLon + 0.000036, w: 1.8, h: 1.8 }
      ];

      configs.forEach(cfg => {
        const entity = document.createElement('a-entity');
        entity.className = 'target-entity';
        entity.dataset.name = cfg.name;
        entity.setAttribute('gps-new-entity-place', `latitude: ${cfg.lat}; longitude: ${cfg.lon}`);

        const image = document.createElement('a-image');
        image.setAttribute('face-me', '');
        image.setAttribute('src', cfg.img);
        image.setAttribute('width', cfg.w);
        image.setAttribute('height', cfg.h);
        image.setAttribute('position', '0 1.5 0');
        image.setAttribute('material', 'alphaTest: 0.1');

        entity.appendChild(image);
        scene.appendChild(entity);
      });
      isGpsAnchored = true;
    }

    btnRecenter.addEventListener('click', () => {
      if (me) {
        anchorTargetsToGps(me.latitude, me.longitude);
        alert('ปักหมุดทั้ง 3 รูปไว้รอบตัวคุณในระยะไม่เกิน 5 เมตรแล้วครับ');
      } else {
        alert('กำลังรอสัญญาณ GPS กรุณารอสักครู่ครับ');
      }
    });

    // โหมดจำลอง (?sim) สำหรับทดสอบบนคอมพิวเตอร์
    scene.addEventListener('loaded', () => {
      if (SIM) {
        const baseLat = 13.7563;
        const baseLon = 100.5018;
        anchorTargetsToGps(baseLat, baseLon);

        setTimeout(() => {
          cam.setAttribute('gps-new-camera', {
            simulateLatitude: baseLat - 0.000035,
            simulateLongitude: baseLon
          });
        }, 500);
      }
    });

    cam.addEventListener('gps-camera-update-position', e => {
      me = e.detail.position;
      gpsStatus = SIM ? 'โหมดจำลอง' : 'รับตำแหน่ง GPS แล้ว';
    });

    // อ่านพิกัด GPS จริงจากมือถือ
    if (!SIM) {
      if (!window.isSecureContext) {
        gpsStatus = 'GPS ใช้ไม่ได้: ต้องเปิดผ่าน HTTPS (GitHub Pages)';
      } else if (!navigator.geolocation) {
        gpsStatus = 'เบราว์เซอร์นี้ไม่รองรับ GPS กรุณาเปิดด้วย Chrome';
      } else {
        navigator.geolocation.watchPosition(p => {
          me = { latitude: p.coords.latitude, longitude: p.coords.longitude };
          accuracy = p.coords.accuracy;
          gpsStatus = 'รับตำแหน่ง GPS แล้ว (ปักหมุดรอบตัว 5 ม.)';

          if (!isGpsAnchored) {
            anchorTargetsToGps(me.latitude, me.longitude);
          }
        }, error => {
          const messages = {
            1: 'ไม่ได้รับสิทธิ์ Location: กรุณาอนุญาตในการตั้งค่า Chrome',
            2: 'หาตำแหน่งไม่พบ: กรุณาเปิด GPS ของมือถือ',
            3: 'ขอตำแหน่งนานเกินไป'
          };
          gpsStatus = (messages[error.code] || 'อ่านตำแหน่งไม่ได้') + ' (กำลังแสดงภาพแบบคงที่ตรงหน้า)';
        }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
      }
    }

    // อัปเดตข้อมูลบนแถบ HUD ทุก 1 วินาที
    setInterval(() => {
      if (!me) {
        hudText.innerHTML = `${gpsStatus}<br>กำลังเชื่อมต่อสัญญาณภาพ 3 มิติ...`;
        return;
      }
      const acc = SIM ? 'โหมดจำลอง' : (accuracy ? '± ' + Math.round(accuracy) + ' ม.' : '…');
      const targetElements = document.querySelectorAll('.target-entity');
      const rows = Array.from(targetElements).map(p => {
        let d = p.components['gps-new-entity-place'] ? p.components['gps-new-entity-place'].distance : undefined;
        if ((d === undefined || isNaN(d)) && me) {
          const pos = p.getAttribute('gps-new-entity-place');
          if (pos) {
            d = calculateDistance(me.latitude, me.longitude, parseFloat(pos.latitude), parseFloat(pos.longitude));
          }
        }
        return `${p.dataset.name}: <b>${d === undefined ? '3 ม.' : Math.round(d) + ' ม.'}</b>`;
      }).join(' · ');

      hudText.innerHTML = `${gpsStatus}<br>พิกัด: ${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)} · ความแม่นยำ <b>${acc}</b><br>${rows}`;
    }, 1000);
  </script>
</body>
</html>
