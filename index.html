<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR ตามพิกัด · 0214381 Lab 3</title>

  <!-- A-Frame 1.6.0 และ AR.js 3.4.8 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    // ให้ภาพหันหน้าเข้าหาผู้ใช้เสมอ (Billboard effect)
    AFRAME.registerComponent('face-me', {
      tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        const me = new THREE.Vector3(), target = new THREE.Vector3();
        this.el.object3D.getWorldPosition(me);
        cam.getWorldPosition(target);
        target.y = me.y;
        if (me.distanceToSquared(target) > 0.001) {
          this.el.object3D.lookAt(target);
        }
      }
    });

    // สั่ง Three.js เคลียร์ฉากเป็นแบบโปร่งใส 100% ป้องกัน Canvas สีดำบังกล้อง
    AFRAME.registerComponent('transparent-canvas', {
      init: function () {
        const scene = this.el;
        const setClear = () => {
          if (scene.renderer) {
            scene.renderer.setClearColor(0x000000, 0);
          }
        };
        if (scene.renderer) {
          setClear();
        } else {
          scene.addEventListener('render-start', setClear);
        }
      }
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ซ่อนหน้าจอโหลดสีฟ้าของ A-Frame */
    .a-loader-title, .a-loading-screen, .a-fullscreen .a-loader-title {
      display: none !important;
      visibility: hidden !important;
    }

    /* วิดีโอกล้อง Native Layer อยู่หลังสุด */
    video#arjs-video, body > video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: -1 !important;
      display: block !important;
    }

    /* Canvas 3D โปร่งใส อยู่เหนือวิดีโอ */
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      z-index: 1 !important;
    }

    /* แถบข้อมูลด้านบน (HUD) */
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(42, 27, 92, 0.92);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #hud b { color: #C9B8F0; }

    .btn-action {
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .btn-action:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <!-- แถบข้อมูลด้านบน -->
  <div id="hud">
    <div id="hud-text">กำลังเชื่อมต่อกล้องและเซนเซอร์ตำแหน่งเครื่อง…</div>
    <div>
      <button class="btn-action" id="btn-recenter">📍 ปักหมุดรอบตัวฉัน (5 ม.)</button>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene transparent-canvas
           loading-screen="enabled: false"
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">

    <!-- กล้องรับตำแหน่ง GPS (ยอมรับทุกความแม่นยำ ไม่ตัดทิ้ง) -->
    <a-camera gps-new-camera="gpsMinDistance: 1; positionMinAccuracy: 100000"></a-camera>

    <!-- วัตถุทั้ง 3 จุด: ผูก gps-new-entity-place ไว้เสมอ ป้องกันการหลุดพิกัด -->
    <a-entity id="point-a" class="target-entity" data-name="Minecraft (A)" gps-new-entity-place="latitude: 0.000027; longitude: 0">
      <a-image face-me src="assets/point-a.png" width="2.2" height="1.24" position="0 1.5 0"></a-image>
    </a-entity>

    <a-entity id="point-b" class="target-entity" data-name="Stardew (B)" gps-new-entity-place="latitude: 0.000028; longitude: 0.000028">
      <a-image face-me src="assets/point-b.png" width="2.2" height="1.17" position="0 1.5 0"></a-image>
    </a-entity>

    <a-entity id="point-c" class="target-entity" data-name="Don't Starve (C)" gps-new-entity-place="latitude: 0; longitude: 0.000036">
      <a-image face-me src="assets/point-c.png" width="1.8" height="1.8" position="0 1.5 0"></a-image>
    </a-entity>

  </a-scene>

  <script>
    const SIM = new URLSearchParams(location.search).has('sim');
    const hudText = document.getElementById('hud-text');
    const btnRecenter = document.getElementById('btn-recenter');
    const scene = document.querySelector('a-scene');
    const cam = document.querySelector('[gps-new-camera]');
    let me = null, accuracy = null;
    let gpsStatus = 'กำลังอ่านพิกัดเครื่อง…';

    // ปลดล็อกวิดีโอบนมือถือเมื่อแตะหน้าจอ
    const unlockVideo = () => {
      const v = document.querySelector('video');
      if (v && v.paused) {
        v.play().catch(() => {});
      }
    };
    window.addEventListener('touchstart', unlockVideo, { once: true });
    window.addEventListener('click', unlockVideo, { once: true });

    // คำนวณระยะทาง Haversine Formula (เมตร)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // อัปเดตพิกัดเป้าหมายทั้ง 3 รูปให้อยู่รอบตัวผู้ใช้ในระยะ 3 - 4.5 เมตร (ไม่เกิน 5 เมตร)
    function updateTargetsNear(userLat, userLon) {
      const pointA = document.getElementById('point-a');
      const pointB = document.getElementById('point-b');
      const pointC = document.getElementById('point-c');

      // จุด A (Minecraft): ไปทางเหนือ ~3 เมตร
      if (pointA) {
        pointA.setAttribute('gps-new-entity-place', `latitude: ${userLat + 0.000027}; longitude: ${userLon}`);
      }
      // จุด B (Stardew Valley): ไปทางตะวันออกเฉียงเหนือ ~4.5 เมตร
      if (pointB) {
        pointB.setAttribute('gps-new-entity-place', `latitude: ${userLat + 0.000028}; longitude: ${userLon + 0.000028}`);
      }
      // จุด C (Don't Starve): ไปทางตะวันออก ~4 เมตร
      if (pointC) {
        pointC.setAttribute('gps-new-entity-place', `latitude: ${userLat}; longitude: ${userLon + 0.000036}`);
      }
    }

    // เมื่อได้รับพิกัดจากเครื่อง (ยอมรับทุกความแม่นยำ ป้องกันการค้าง)
    function onGotDeviceLocation(lat, lon, acc) {
      me = { latitude: lat, longitude: lon };
      accuracy = acc || accuracy;
      gpsStatus = 'รับพิกัดจากเครื่องแล้ว (ปักหมุดรอบตัวไม่เกิน 5 ม.)';
      updateTargetsNear(lat, lon);
    }

    // ปุ่มปักหมุดรอบตัวฉัน
    btnRecenter.addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (p) => {
            onGotDeviceLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
            alert('ปักหมุดทั้ง 3 รูปไว้รอบตัวคุณในระยะไม่เกิน 5 เมตรแล้วครับ');
          },
          () => {
            if (me) {
              updateTargetsNear(me.latitude, me.longitude);
              alert('ปักหมุดรอบตำแหน่งเครื่องล่าสุดแล้วครับ');
            } else {
              alert('กำลังรอพิกัดจากเครื่อง กรุณาเปิด Location ครับ');
            }
          },
          { enableHighAccuracy: false, timeout: 5000, maximumAge: Infinity }
        );
      } else if (me) {
        updateTargetsNear(me.latitude, me.longitude);
      }
    });

    // โหมดจำลอง (?sim) สำหรับทดสอบบนคอมพิวเตอร์
    scene.addEventListener('loaded', () => {
      if (SIM) {
        const baseLat = 13.7563;
        const baseLon = 100.5018;
        onGotDeviceLocation(baseLat, baseLon, 5);

        setTimeout(() => {
          cam.setAttribute('gps-new-camera', {
            simulateLatitude: baseLat - 0.000035,
            simulateLongitude: baseLon
          });
        }, 500);
      }
    });

    // ดักรับตำแหน่งจากคอมโพเนนต์กล้อง AR.js
    cam.addEventListener('gps-camera-update-position', e => {
      if (e.detail && e.detail.position) {
        onGotDeviceLocation(e.detail.position.latitude, e.detail.position.longitude, accuracy);
      }
    });

    // อ่านพิกัดตรงจากเครื่องมือถือ
    if (!SIM) {
      if (!window.isSecureContext) {
        gpsStatus = 'GPS ใช้ไม่ได้: ต้องเปิดผ่าน HTTPS (GitHub Pages)';
      } else if (!navigator.geolocation) {
        gpsStatus = 'เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง';
      } else {
        // อ่านพิกัดทันที (ทั้งแบบ High Accuracy และแบบทั่วไป)
        navigator.geolocation.getCurrentPosition(
          p => onGotDeviceLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
          () => {},
          { enableHighAccuracy: false, timeout: 5000, maximumAge: Infinity }
        );

        navigator.geolocation.watchPosition(
          p => onGotDeviceLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
          error => {
            if (!me) gpsStatus = 'กรุณากดยินยอมสิทธิ์ Location เมื่อเบราว์เซอร์ถาม';
          },
          { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 }
        );
      }
    }

    // อัปเดตข้อมูลบนแถบ HUD ทุก 1 วินาที
    setInterval(() => {
      const acc = SIM ? 'โหมดจำลอง' : (accuracy ? '± ' + Math.round(accuracy) + ' ม.' : '…');
      const targetElements = document.querySelectorAll('.target-entity');
      const rows = Array.from(targetElements).map(p => {
        let d = undefined;
        if (p.components['gps-new-entity-place']) {
          d = p.components['gps-new-entity-place'].distance;
        }
        if ((d === undefined || isNaN(d)) && me) {
          const pos = p.getAttribute('gps-new-entity-place');
          if (pos) {
            d = calculateDistance(me.latitude, me.longitude, parseFloat(pos.latitude), parseFloat(pos.longitude));
          }
        }
        return `${p.dataset.name}: <b>${d === undefined ? '3 ม.' : Math.round(d) + ' ม.'}</b>`;
      }).join(' · ');

      const posText = me ? `พิกัดเครื่อง: ${me.latitude.toFixed(6)}, ${me.longitude.toFixed(6)} · ความแม่นยำ <b>${acc}</b>` : 'กำลังระบุพิกัดเครื่อง...';
      hudText.innerHTML = `${gpsStatus}<br>${posText}<br>${rows}`;
    }, 1000);
  </script>
</body>
</html>
